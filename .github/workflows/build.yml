name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,  cc: gcc,   exe: "" }
          - { name: macos-arm64,    os: macos-latest,   cc: clang, exe: "" }
          - { name: windows-x86_64, os: windows-latest, cc: gcc,   exe: ".exe" }
    env:
      CC: ${{ matrix.cc }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 coreutils

      - name: Install toolchain and SDL2 (Windows / MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Package
        run: |
          d=tvm-${{ matrix.name }}
          mkdir "$d"
          cp tvm${{ matrix.exe }} tasm${{ matrix.exe }} tdis${{ matrix.exe }} README.md "$d"/
          cp -r examples "$d"/examples
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$(dirname "$(command -v sdl2-config)")/SDL2.dll" "$d"/
            zip -qr "$d.zip" "$d"
          else
            tar czf "$d.tar.gz" "$d"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tvm-${{ matrix.name }}
          path: tvm-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
